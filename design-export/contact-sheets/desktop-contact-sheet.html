<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nerix Desktop Contact Sheet</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #050505;
        color: #ffffff;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .sheet {
        width: 1680px;
        padding: 52px;
      }

      .header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 32px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.16);
        padding-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 42px;
        font-weight: 520;
        letter-spacing: 0;
      }

      .meta {
        margin: 0;
        color: rgba(255, 255, 255, 0.62);
        font-size: 18px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 28px;
      }

      .frame {
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        background: #000000;
      }

      .label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 52px;
        padding: 0 18px;
        color: rgba(255, 255, 255, 0.78);
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 17px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <header class="header">
        <h1>Nerix UI Export</h1>
        <p class="meta">Desktop screens / upload-ready contact sheet</p>
      </header>

      <section class="grid">
        <article class="frame">
          <div class="label"><span>01 Landing</span><span>1440 x 1100</span></div>
          <img src="../screenshots/desktop/01-landing.png" alt="Landing" />
        </article>
        <article class="frame">
          <div class="label"><span>02 About</span><span>1440 x 1100</span></div>
          <img src="../screenshots/desktop/02-about.png" alt="About" />
        </article>
        <article class="frame">
          <div class="label"><span>03 Workspace Home</span><span>1440 x 1100</span></div>
          <img src="../screenshots/desktop/03-workspace-home.png" alt="Workspace home" />
        </article>
        <article class="frame">
          <div class="label"><span>04 Chat</span><span>1440 x 1100</span></div>
          <img src="../screenshots/desktop/04-chat.png" alt="Chat" />
        </article>
        <article class="frame">
          <div class="label"><span>05 Agents</span><span>1440 x 1100</span></div>
          <img src="../screenshots/desktop/05-agents.png" alt="Agents" />
        </article>
        <article class="frame">
          <div class="label"><span>06 Balance</span><span>1440 x 1100</span></div>
          <img src="../screenshots/desktop/06-balance.png" alt="Balance" />
        </article>
        <article class="frame">
          <div class="label"><span>07 Memory</span><span>1440 x 1100</span></div>
          <img src="../screenshots/desktop/07-memory.png" alt="Memory" />
        </article>
        <article class="frame">
          <div class="label"><span>08 Settings</span><span>1440 x 1100</span></div>
          <img src="../screenshots/desktop/08-settings.png" alt="Settings" />
        </article>
      </section>
    </main>
  </body>
</html>

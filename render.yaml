services:
  - type: web
    name: nomduchat-api
    runtime: node
    rootDir: .
    plan: starter
    buildCommand: npm install && npm run api:build
    preDeployCommand: npm --prefix apps/api run migrate:build
    startCommand: npm --prefix apps/api run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_RUN_MIGRATIONS
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: API_PUBLIC_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ABUSE_PROTECTION_ENABLED
        value: "true"
      - key: ABUSE_TRUST_PROXY_HEADERS
        value: "true"
      - key: ABUSE_HASH_SECRET
        generateValue: true
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_REQUIRED
        value: "false"
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_CODE_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: GEMINI_VIDEO_MODEL
        value: veo-3.1-lite-generate-preview
      - key: GEMINI_MUSIC_MODEL
        value: lyria-3-clip-preview
      - key: SMTP_BZ_API_KEY
        sync: false
      - key: PASSWORD_RESET_FROM_EMAIL
        value: admin@nomduchat.com
      - key: PASSWORD_RESET_FROM_NAME
        value: nomduchat
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"
      - key: MAILINGS_API_TOKEN
        sync: false
      - key: LIFECYCLE_NOTIFICATIONS_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VK_CLIENT_ID
        sync: false
      - key: VK_CLIENT_SECRET
        sync: false
      - key: YANDEX_CLIENT_ID
        sync: false
      - key: YANDEX_CLIENT_SECRET
        sync: false
      - key: KASPI_CHECKOUT_URL
        sync: false
      - key: KASPI_API_TOKEN
        sync: false
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: YOOKASSA_RECEIPT_VAT_CODE
        value: "1"
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "false"
      - key: AI_PROVIDER_POLICY
        value: production_rules

  - type: web
    name: nomduchat-web
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run web:build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nomduchat-api
          envVarKey: API_PUBLIC_URL
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
